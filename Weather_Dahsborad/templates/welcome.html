<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="logout">
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>

  <div class="dashboard-container">
    <h1>🌤 Weather in {{ city }}</h1>

    <!-- Search box -->
    <div class="search-box">
      <form method="POST" action="/welcome">
        <select name="city" required class="styled-select">
    <option value="" {% if not city %}selected{% endif %}>Select your city</option>
    {% set tamilnadu_cities = [
        "Ariyalur", "Chennai", "Coimbatore", "Cuddalore", "Dharmapuri",
        "Dindigul", "Erode", "Kallakurichi", "Kancheepuram", "Karur",
        "Krishnagiri", "Madurai", "Nagapattinam", "Namakkal", "Nilgiris",
        "Perambalur", "Pudukkottai", "Ramanathapuram", "Ranipet", "Salem",
        "Sivaganga", "Tenkasi", "Thanjavur", "Theni", "Thoothukudi",
        "Tiruchirappalli", "Tirunelveli", "Tirupattur", "Tiruppur",
        "Tiruvallur", "Tiruvannamalai", "Tiruvarur", "Vellore",
        "Villupuram", "Virudhunagar", "Chengalpattu", "Kanyakumari", "Mayiladuthurai"
    ] %}
    {% for c in tamilnadu_cities %}
        <option value="{{ c }}" {% if city == c %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
</select>
        <br><button type="submit">Search</button>
      </form>
    </div>

    <!-- Weather cards -->
    <div class="card-container">
      {% for day in weather_data %}
        <div class="card">
          <h3>{{ day.date }}</h3>
          <p>🌡 Temp: {{ day.temp }}°C</p>
          <p>🌧 Rain: {{ day.rain }} mm</p>
          <p>☁ Condition: {{ day.weather }}</p>
        </div>
      {% endfor %}
    </div>
    <!-- Weather Suggestion -->
{% if suggestion %}
  <div class="suggestion-box">
    <h2>{{ suggestion.quote }}</h2>
    <p>💡 <strong>Health Tip:</strong> {{ suggestion.advice }}</p>
  </div>
{% endif %}

    <!-- Chart -->
    <canvas id="tempChart" width="800" height="400"></canvas>
  </div>

  <script>
    const weatherData = JSON.parse(`{{ weather_data | tojson | safe | default("[]") }}`);
    const labels = weatherData.map(day => day.date);
    const temps = weatherData.map(day => day.temp);

    const ctx = document.getElementById("tempChart").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Temperature (°C)",
          data: temps,
          borderColor: "rgba(255, 99, 132, 1)",
          backgroundColor: "rgba(255, 99, 132, 0.2)",
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: true } }
      }
    });
  </script>
</body>
</html>
