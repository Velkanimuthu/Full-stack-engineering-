<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffb6c1, #ff69b4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .signup-container {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }
    .signup-container h2 {
      color: #ff1493;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }
    input:focus {
      border-color: #ff69b4;
      box-shadow: 0 0 8px rgba(255,105,180,0.5);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff69b4;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    button:hover {
      background: #ff1493;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 5px;
      text-align: left;
    }
    .link {
      margin-top: 15px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Create Account</h2>
    <form id="signupForm" method="POST" action="{{ url_for('create') }}">
      <input type="text" name="name" id="name" placeholder="Enter your Name" required>
      <input type="email" name="email" id="email" placeholder="Enter your Email" required>
      <input type="password" name="password" id="password" placeholder="Enter your Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <div id="errorMsg" class="error">
        {% if error %} {{ error }} {% endif %}
      </div>
      <button type="submit">Create Account</button>
    </form>
    <a class="link" href="{{ url_for('login') }}">Already have an account? Login</a>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirmPassword").value;
      let errorMsg = document.getElementById("errorMsg");

      let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;

      if (!passwordRegex.test(password)) {
        event.preventDefault();
        errorMsg.textContent = "Password must have at least 6 characters, including uppercase, lowercase, and a number.";
        return;
      }
      if (password !== confirmPassword) {
        event.preventDefault();
        errorMsg.textContent = "Passwords do not match!";
        return;
      }
    });
  </script>
</body>
</html>
